<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="css/form.css">
</head>

<body>
    <h1>Product Review Form</h1>
    <form method="get" action="review.html">
        <label for="productName">Product Name:</label>
        <select id="productName" name="productName" required>
            <option value="" disabled selected>Select a Product ...</option>
        </select>

        <fieldset>
            <legend>Overall Rating:</legend>
            <label><input type="radio" name="rating" id="star1" value="1" required>☆</label>
            <label><input type="radio" name="rating" id="star2" value="2">☆☆</label>
            <label><input type="radio" name="rating" id="star3" value="3">☆☆☆</label>
            <label><input type="radio" name="rating" id="star4" value="4">☆☆☆☆</label>
            <label><input type="radio" name="rating" id="star5" value="5">☆☆☆☆☆</label>
        </fieldset>

        <label for="installDate">Date of Installation:</label>
        <input type="date" id="installDate" name="installDate" required>

        <fieldset>
            <legend>Useful Features (check all that apply):</legend>
            <label><input type="checkbox" id="feature1" name="features" value="Feature 1"> Feature 1</label>
            <label><input type="checkbox" id="feature2" name="features" value="Feature 2"> Feature 2</label>
            <label><input type="checkbox" id="feature3" name="features" value="Feature 3"> Feature 3</label>
        </fieldset>

        <label for="review">Written Review:</label>
        <textarea id="review" name="review" rows="4" cols="50"></textarea>

        <label for="username">User Name:</label>
        <input type="text" id="username" name="username">

        <input type="submit" value="Submit Review">
    </form>

    <footer>
        <p>&copy; 2025 - Product Reviews</p>
    </footer>
    <script src="js/form.js" defer></script>
</body>

</html>
